worker_processes auto;
pid /tmp/front-wars-nginx/nginx.pid;
error_log /dev/stderr warn;

include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 8192;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/front-wars-nginx/body;
    proxy_temp_path /tmp/front-wars-nginx/proxy;
    fastcgi_temp_path /tmp/front-wars-nginx/fastcgi;
    uwsgi_temp_path /tmp/front-wars-nginx/uwsgi;
    scgi_temp_path /tmp/front-wars-nginx/scgi;

    include /tmp/front-wars-nginx/conf.d/*.conf;
    include /etc/nginx/conf.d/*.conf;
}
